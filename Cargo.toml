[package]
name = "keyprod"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
lexopt = "0.3.1"
libc = "0.2.174"
libudev = "0.3.0"
nix = { version = "0.30.1", features = ["event"] }
rusqlite = "0.37.0"

[build-dependencies]
bindgen = "0.72.0"
prettyplease = "0.2.37"
quote = "1.0.41"
syn = { version = "2.0.106", features = ["parsing"] }

[dev-dependencies]
mockall = "0.13.1"
